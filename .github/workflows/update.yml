name: update-weather-data

on:
  schedule:
    - cron: "30 4,10,16,22 * * *"  # 每輪 GFS (00/06/12/18Z) + 4.5h 發布 lag
  workflow_dispatch:

concurrency:
  group: update-weather-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Pinned versions, hashes required, wheels only (scripts/lock-requirements.sh, README).
      - run: 'pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - run: pytest
      - run: python -m pipeline.main
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: stormrider-weather

  # repo 連續 60 天無活動時 GitHub 會自動停用排程 workflow；管線本身很少改 code，
  # 所以每次執行都呼叫 enable API 嘗試重置計時。這是 keepalive-workflow v2 的做法，
  # GitHub 並未文件保證它會重置計時；若仍收到停用通知，改用定期空 commit。
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      # The monthly search workflow rides along. Its failure must not mark a successful weather run
      # as failed (that would e-mail every six hours), so it only leaves a warning on the run.
      - run: >-
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/search-data.yml/enable"
          || echo "::warning::could not re-enable search-data.yml; check it on the Actions page"
        env:
          GH_TOKEN: ${{ github.token }}
